<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Jack and Jill - Read & Learn Storybook</title>
  
  <!-- PWA & Mobile Web App Meta -->
  <meta name="description" content="An interactive illustrated reading game and nursery rhyme storybook with karaoke read-aloud, phonics, and offline play.">
  <meta name="theme-color" content="#7357D9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jack & Jill">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Google Fonts: Fredoka for rounded kid-friendly typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #7357D9;
      --primary-dark: #583CB8;
      --primary-soft: #F0EBFF;
      --yellow: #FFD233;
      --yellow-glow: #FFE885;
      --green: #38C172;
      --green-soft: #E6FAF0;
      --coral: #FF6584;
      --sky: #BAE6FD;
      --ink: #1C1E38;
      --ink-muted: #5C6285;
      --surface: #FFFFFF;
      --bg-page: #F6F4FF;
      --border-soft: #E6E0FA;
      --shadow-sm: 0 4px 12px rgba(60, 40, 130, 0.06);
      --shadow-card: 0 12px 32px rgba(50, 30, 110, 0.1);
      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 28px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(180deg, #F3EFFF 0%, #FAF8FF 40%, #EDF6FF 100%);
      color: var(--ink);
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Fredoka', cursive;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--primary);
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--yellow);
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      box-shadow: 0 3px 8px rgba(255, 210, 51, 0.4);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chip-btn {
      background: var(--surface);
      border: 1.5px solid var(--border-soft);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: var(--shadow-sm);
      touch-action: manipulation;
    }

    .icon-btn {
      background: var(--surface);
      border: 1.5px solid var(--border-soft);
      border-radius: 12px;
      width: 36px;
      height: 36px;
      font-size: 1rem;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      touch-action: manipulation;
    }

    .icon-btn:active, .chip-btn:active {
      transform: scale(0.92);
      background: var(--primary-soft);
    }

    /* PWA Install Banner */
    #pwaInstallBanner {
      display: none;
      background: linear-gradient(90deg, #7357D9, #9175F2);
      color: white;
      padding: 8px 14px;
      border-radius: 14px;
      margin: 0 14px 8px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 16px rgba(115, 87, 217, 0.25);
      flex-shrink: 0;
    }

    #pwaInstallBanner.show { display: flex; }

    .install-btn {
      background: var(--yellow);
      color: var(--ink);
      border: none;
      padding: 6px 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* Main Phone-Optimized Container */
    main {
      flex: 1;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: flex-start;
    }

    /* Star Milestones Ribbon */
    .star-ribbon {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--border-soft);
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }

    .act-title {
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary);
    }

    .stars-cluster {
      display: flex;
      gap: 4px;
    }

    .star-item {
      font-size: 1.25rem;
      filter: grayscale(100%) opacity(0.3);
      transition: filter 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .star-item.earned {
      filter: none;
      transform: scale(1.2);
      animation: starBounce 0.4s ease forwards;
    }

    @keyframes starBounce {
      0% { transform: scale(0.5); }
      70% { transform: scale(1.4); }
      100% { transform: scale(1.15); }
    }

    /* Core Storybook Card */
    .storybook-card {
      background: var(--surface);
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    /* Responsive Illustrated Storybook Stage */
    .stage-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 240px;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: linear-gradient(180deg, #96CEFF 0%, #D4EEFF 65%, #BAEAB0 100%);
      border: 2px solid #D6E4F0;
      position: relative;
      cursor: pointer;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05);
      flex-shrink: 0;
    }

    .stage-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .stage-badge {
      position: absolute;
      bottom: 6px;
      right: 8px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(4px);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--ink-muted);
      pointer-events: none;
    }

    /* Interactive Story Emoji Ribbon */
    .emoji-ribbon {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      font-size: clamp(2rem, 7.5vw, 2.75rem);
      padding: 2px 0 4px;
      user-select: none;
      filter: drop-shadow(0 4px 10px rgba(80, 50, 150, 0.1));
    }

    .emoji-item {
      display: inline-block;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .emoji-item:hover, .emoji-item:active {
      transform: scale(1.35) rotate(-6deg);
    }

    /* Karaoke Text Reader */
    .reader-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 4px 0;
      min-height: 90px;
      text-align: center;
    }

    .verse-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 8px;
      align-items: baseline;
      width: 100%;
    }

    .word-chip {
      font-family: 'Fredoka', cursive;
      font-size: clamp(1.45rem, 5.5vw, 2.2rem);
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 14px;
      border: 2px solid transparent;
      background: #F8F6FE;
      color: var(--ink);
      cursor: pointer;
      line-height: 1.15;
      touch-action: manipulation;
      transition: background 0.1s ease, transform 0.12s ease, border-color 0.1s;
    }

    .word-chip:hover {
      background: #FFF9DB;
      border-color: var(--yellow);
    }

    .word-chip:active {
      transform: scale(0.92);
    }

    /* Active Flashing Highlight - Bright, readable, golden */
    .word-chip.active {
      background: var(--yellow) !important;
      border-color: #E8B800 !important;
      color: #000000 !important;
      transform: scale(1.1) translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 210, 51, 0.6);
      z-index: 2;
    }

    .word-chip.rhyme-word {
      text-decoration: underline wavy var(--primary);
      text-underline-offset: 4px;
    }

    /* Rhyme Bar */
    .rhyme-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--ink-muted);
      background: #F4F0FF;
      padding: 4px 12px;
      border-radius: 999px;
      flex-wrap: wrap;
    }

    .rhyme-pill {
      background: var(--primary);
      color: white;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
    }

    /* Progress Line */
    .progress-track {
      height: 8px;
      background: #EAE5F8;
      border-radius: 999px;
      overflow: hidden;
      margin: 2px 0;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #38C172, #2BB663);
      width: 0%;
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .status-caption {
      text-align: center;
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--ink-muted);
      min-height: 20px;
    }

    /* Ergonomic Bottom Floating Action Bar */
    .action-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      margin-top: 4px;
    }

    .play-btn {
      flex: 2;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 18px;
      padding: 12px 16px;
      font-family: 'Fredoka', cursive;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(115, 87, 217, 0.35);
      touch-action: manipulation;
      transition: transform 0.12s ease, background 0.15s;
    }

    .play-btn:active {
      transform: scale(0.96);
      background: var(--primary-dark);
    }

    .sub-btn {
      flex: 1;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1.5px solid #DDD3FA;
      border-radius: 18px;
      padding: 12px 10px;
      font-family: 'Fredoka', cursive;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      touch-action: manipulation;
    }

    .sub-btn:active {
      transform: scale(0.95);
      background: #E6DCFF;
    }

    /* Comprehension Question Card */
    .quiz-card {
      background: #FAF9FF;
      border: 2px dashed #D6CDF5;
      border-radius: var(--radius-md);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .quiz-prompt-btn {
      background: none;
      border: none;
      font-family: 'Fredoka', cursive;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 14px;
      touch-action: manipulation;
      transition: transform 0.15s ease, background 0.15s;
    }

    .quiz-prompt-btn:active, .quiz-prompt-btn:hover {
      background: #EFEAFF;
      transform: scale(0.97);
    }

    .quiz-prompt {
      font-family: 'Fredoka', cursive;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--ink);
      text-align: center;
    }

    .options-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .option-card {
      background: var(--surface);
      border: 2.5px solid #E6E0F8;
      border-radius: 16px;
      padding: 10px 8px;
      font-family: 'Fredoka', cursive;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: var(--shadow-sm);
      touch-action: manipulation;
      transition: all 0.15s ease;
      min-height: 72px;
    }

    .option-card:active { transform: scale(0.95); }

    .option-card .opt-icon { font-size: 1.8rem; line-height: 1; }
    .option-card .opt-text { font-size: 0.85rem; color: var(--ink-muted); text-align: center; }

    .option-card.correct {
      border-color: var(--green);
      background: var(--green-soft);
      color: #146C36;
      transform: scale(1.02);
    }

    .option-card.wrong {
      border-color: var(--coral);
      background: #FFF0F3;
      animation: shakeCard 0.35s ease;
    }

    @keyframes shakeCard {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    /* Tap Phonics Toast Popup */
    #phonicsToast {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--surface);
      border: 3px solid var(--primary);
      border-radius: 22px;
      padding: 16px 24px;
      box-shadow: 0 16px 40px rgba(40, 20, 90, 0.25);
      z-index: 100;
      text-align: center;
      animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes popIn {
      from { transform: translate(-50%, -42%) scale(0.85); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .toast-word {
      font-family: 'Fredoka', cursive;
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
    }

    .toast-phonics {
      font-size: 1.25rem;
      color: var(--ink-muted);
      font-weight: 800;
      margin: 4px 0 8px;
    }

    /* Story Celebration Overlay */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(25, 18, 55, 0.72);
      backdrop-filter: blur(6px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.active { display: flex; }

    .modal-box {
      background: white;
      border-radius: 28px;
      padding: 24px 20px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-box h2 {
      font-family: 'Fredoka', cursive;
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      margin: 8px 0;
    }

    /* Confetti Canvas */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 199;
    }

    @media (max-width: 380px) {
      header { padding: 6px 10px; }
      main { padding: 0 10px 14px; }
      .word-chip { font-size: 1.35rem; padding: 4px 10px; }
      .play-btn { font-size: 1.05rem; padding: 10px 12px; }
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header>
    <div class="brand">
      <div class="brand-badge">🪣</div>
      <span>Jack & Jill</span>
    </div>
    <div class="header-controls">
      <button id="voiceBtn" class="chip-btn" title="Change Voice">🗣️ Voice</button>
      <button id="speedBtn" class="chip-btn" title="Reading Pace">🐢 0.8x</button>
      <button id="soundToggleBtn" class="icon-btn" title="Sound Effects">🔊</button>
    </div>
  </header>

  <!-- PWA Install Banner -->
  <div id="pwaInstallBanner">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 0.85rem;">
      <span>📱</span>
      <span>Add App to Home Screen</span>
    </div>
    <button id="installAppBtn" class="install-btn">Install</button>
  </div>

  <main>
    <!-- Star Milestones Ribbon -->
    <div class="star-ribbon">
      <span id="actTitle" class="act-title">Act 1: Up the Hill</span>
      <div class="stars-cluster">
        <span class="star-item" data-star="0">⭐</span>
        <span class="star-item" data-star="1">⭐</span>
        <span class="star-item" data-star="2">⭐</span>
        <span class="star-item" data-star="3">⭐</span>
        <span class="star-item" data-star="4">⭐</span>
      </div>
    </div>

    <!-- Storybook Card -->
    <section class="storybook-card">
      
      <!-- Responsive Illustrated Storybook Stage -->
      <div id="stageFrame" class="stage-wrapper" title="Tap anything to hear sounds!">
        <svg id="stageSvg" class="stage-svg" viewBox="0 0 800 380" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#72BFFF"/>
              <stop offset="55%" stop-color="#C2E4FF"/>
              <stop offset="100%" stop-color="#F2FAFF"/>
            </linearGradient>
            <linearGradient id="hillFar" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#7CD9A0"/>
              <stop offset="100%" stop-color="#4CB872"/>
            </linearGradient>
            <linearGradient id="hillMid" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#55D187"/>
              <stop offset="100%" stop-color="#2D9A58"/>
            </linearGradient>
            <linearGradient id="hillFront" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#3DC972"/>
              <stop offset="100%" stop-color="#208745"/>
            </linearGradient>
            <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFF2CE"/>
              <stop offset="60%" stop-color="#EED394"/>
              <stop offset="100%" stop-color="#D9B76A"/>
            </linearGradient>
            <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFE666"/>
              <stop offset="100%" stop-color="#FFA800"/>
            </linearGradient>
            <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#E05B43"/>
              <stop offset="100%" stop-color="#A8321D"/>
            </linearGradient>
            <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
              <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1B2A4A" flood-opacity="0.15"/>
            </filter>
          </defs>

          <!-- Sky Background -->
          <rect width="800" height="380" fill="url(#skyGrad)"/>

          <!-- Animated Smiling Sun with Glowing Rays -->
          <g id="svgSun" style="cursor: pointer; transform-origin: 715px 65px;" filter="url(#softShadow)">
            <!-- Outer Glow -->
            <circle cx="715" cy="65" r="54" fill="#FFDE59" opacity="0.25"/>
            <circle cx="715" cy="65" r="44" fill="#FFD233" opacity="0.4"/>
            <!-- Sun Rays -->
            <g stroke="#FFAA00" stroke-width="4" stroke-linecap="round" opacity="0.7">
              <line x1="715" y1="12" x2="715" y2="2" />
              <line x1="715" y1="118" x2="715" y2="128" />
              <line x1="662" y1="65" x2="652" y2="65" />
              <line x1="768" y1="65" x2="778" y2="65" />
              <line x1="677" y1="27" x2="670" y2="20" />
              <line x1="753" y1="103" x2="760" y2="110" />
              <line x1="677" y1="103" x2="670" y2="110" />
              <line x1="753" y1="27" x2="760" y2="20" />
            </g>
            <!-- Sun Core -->
            <circle cx="715" cy="65" r="36" fill="url(#sunGlow)"/>
            <!-- Cute Face with Sparkling Eyes -->
            <circle cx="704" cy="60" r="3.5" fill="#422500"/>
            <circle cx="705" cy="59" r="1.2" fill="#FFFFFF"/>
            <circle cx="726" cy="60" r="3.5" fill="#422500"/>
            <circle cx="727" cy="59" r="1.2" fill="#FFFFFF"/>
            <!-- Smile & Blushing Cheeks -->
            <path d="M708,70 Q715,80 722,70" stroke="#5A2E00" stroke-width="2.8" fill="none" stroke-linecap="round"/>
            <ellipse cx="698" cy="66" rx="4" ry="2.2" fill="#FF8383" opacity="0.75"/>
            <ellipse cx="732" cy="66" rx="4" ry="2.2" fill="#FF8383" opacity="0.75"/>
          </g>

          <!-- Puffy Fluffy Clouds -->
          <g filter="url(#softShadow)" opacity="0.95">
            <!-- Cloud Left -->
            <g transform="translate(60, 45)">
              <path d="M30,40 Q15,40 10,25 Q5,10 25,10 Q35,-5 55,2 Q75,-2 85,15 Q100,15 105,30 Q105,40 85,40 Z" fill="#FFFFFF"/>
            </g>

          { icon: "🌧️ 😢", text: "Lost on the hill", correct: false }
        ]
      }
    ];

    /* ==========================================================================
       2. ZERO-DEPENDENCY NATIVE WEB AUDIO SYNTHESIZER
       ========================================================================== */
    class ProceduralAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, dur = 0.15, type = 'sine', gain = 0.2) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        g.gain.setValueAtTime(gain, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);

        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + dur);
      }

      playSuccessChime() {
        const chord = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        chord.forEach((f, idx) => {
          setTimeout(() => this.playTone(f, 0.28, 'triangle', 0.22), idx * 80);
        });
      }

      playSplash() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(680, this.ctx.currentTime + 0.12);
        g.gain.setValueAtTime(0.28, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.14);
      }

      playTap() {
        this.playTone(440, 0.08, 'sine', 0.15);
      }

      playFanfare() {
        if (this.muted) return;
        const notes = [
          { f: 523.25, d: 0.2, t: 0 },
          { f: 659.25, d: 0.2, t: 120 },
          { f: 783.99, d: 0.25, t: 240 },
          { f: 1046.50, d: 0.6, t: 380 }
        ];
        notes.forEach(n => setTimeout(() => this.playTone(n.f, n.d, 'triangle', 0.28), n.t));
      }
    }

    const sound = new ProceduralAudio();

    /* ==========================================================================
       3. VOICES & ROBUST SYNCHRONIZED SPEECH ENGINE
       ========================================================================== */
    window._currentUtterance = null;
    let speechVoices = [];
    let selectedVoiceIndex = 0;
    const speechPaces = [0.82, 0.70, 0.95];
    let paceIndex = 0;

    function populateVoices() {
      if ('speechSynthesis' in window) {
        const rawVoices = window.speechSynthesis.getVoices();
        // Filter english voices
        speechVoices = rawVoices.filter(v => v.lang.startsWith('en'));
        if (speechVoices.length === 0) speechVoices = rawVoices;

        // Auto-select best natural Google voice if available
        const googleIdx = speechVoices.findIndex(v => 
          v.name.includes('Google US English') || 
          v.name.includes('Google UK English Female') || 
          v.name.includes('Natural') || 
          v.name.includes('Samantha')
        );
        if (googleIdx !== -1) selectedVoiceIndex = googleIdx;
      }
    }

    populateVoices();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    // Touch gesture audio unlock
    window.addEventListener('pointerdown', () => {
      sound.init();
      if ('speechSynthesis' in window && window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }
    }, { once: true });

    function getCleanWord(w) {
      return w.replace(/[.,!?;:"'()]/g, '').trim();
    }

    function clearWordHighlights() {
      document.querySelectorAll('.word-chip').forEach(el => el.classList.remove('active'));
    }

    /* ==========================================================================
       4. LINE-BY-LINE PERFECTLY SYNCHRONIZED KARAOKE READER
       ========================================================================== */
    let currentLineIndex = 0;
    let readingCanceled = false;
    let isReadingActive = false;
    let lineTimers = [];

    function clearLineTimers() {
      lineTimers.forEach(t => clearTimeout(t));
      lineTimers = [];
    }

    function readCurrentAct() {
      readingCanceled = false;
      isReadingActive = true;
      clearLineTimers();
      clearWordHighlights();

      if ('speechSynthesis' in window) {
        if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        window.speechSynthesis.cancel();
      }

      const act = STORY_ACTS[currentActIndex];
      statusLabel.textContent = "Listening to the rhyme...";
      currentLineIndex = 0;
      document.getElementById('readBtnText').textContent = "Reading...";

      function playNextLine() {
        if (readingCanceled) return;
        if (currentLineIndex >= act.lines.length) {
          isReadingActive = false;
          clearWordHighlights();
          document.getElementById('readBtnText').textContent = "Read to Me";
          statusLabel.textContent = `Completed ${act.title}! Tap the matching answer below.`;

          // Auto-read the question aloud for the child
          const qTimer = setTimeout(() => {
            if (!readingCanceled && !isReadingActive) {
              speakQuestion(act.question);
            }
          }, 600);
          lineTimers.push(qTimer);
          return;
        }

        const lineStr = act.lines[currentLineIndex];
        const lineIdx = currentLineIndex;
        currentLineIndex++;

        speakLineWithSync(lineStr, lineIdx, () => {
          if (!readingCanceled && isReadingActive) {
            // Poetic breath pause between rhyme lines (350ms)
            const pauseTimer = setTimeout(playNextLine, 350);
            lineTimers.push(pauseTimer);
          }
        });
      }

      playNextLine();
    }

    function speakLineWithSync(lineStr, lineIdx, onDone) {
      if (!('speechSynthesis' in window)) {
        onDone();
        return;
      }

      const lineChips = Array.from(document.querySelectorAll(`.word-chip[data-line="${lineIdx}"]`));
      const words = lineStr.split(/\s+/);
      const pace = speechPaces[paceIndex];

      // Calculate syllable & length weighted intervals for fallback
      const durations = words.map((w) => {
        const clean = getCleanWord(w);
        let ms = Math.max(220, clean.length * 52);
        if (clean.length > 5) ms += 80; // Syllables
        if (w.includes(',') || w.includes(';')) ms += 220; // Comma pause
        if (w.includes('.') || w.includes('!') || w.includes('?')) ms += 320; // End pause
        return ms / (pace * 0.95);
      });

      const utter = new SpeechSynthesisUtterance(lineStr);
      window._currentUtterance = utter; // Prevent GC bug
      utter.rate = pace;
      utter.pitch = 1.05;

      if (speechVoices.length > 0) {
        utter.voice = speechVoices[selectedVoiceIndex] || speechVoices[0];
      }

      let boundaryFired = false;

      // Start highlighting strictly when audio begins coming out of speakers!
      utter.onstart = () => {
        if (readingCanceled) return;
        clearWordHighlights();
        if (lineChips[0]) lineChips[0].classList.add('active');

        // Schedule fallback timing based on real onstart timestamp
        let accumulatedMs = durations[0];
        for (let i = 1; i < lineChips.length; i++) {
          const t = setTimeout(() => {
            if (!boundaryFired && isReadingActive && !readingCanceled) {
              clearWordHighlights();
              if (lineChips[i]) lineChips[i].classList.add('active');
            }
          }, accumulatedMs);
          lineTimers.push(t);
          accumulatedMs += durations[i];
        }
      };

      // Real-time boundary event support (desktop Chrome / macOS Safari)
      utter.onboundary = (e) => {
        if (e.name === 'word' && typeof e.charIndex === 'number') {
          boundaryFired = true;
          clearLineTimers(); // Boundary is active, dismiss fallback

          // Find which word index corresponds to this charIndex
          let charAccumulator = 0;
          let activeWIdx = 0;
          for (let i = 0; i < words.length; i++) {
            if (e.charIndex >= charAccumulator && e.charIndex < charAccumulator + words[i].length + 1) {
              activeWIdx = i;
              break;
            }
            charAccumulator += words[i].length + 1;
          }

          clearWordHighlights();
          if (lineChips[activeWIdx]) {
            lineChips[activeWIdx].classList.add('active');
          }
        }
      };

      utter.onend = () => {
        clearLineTimers();
        clearWordHighlights();
        onDone();
      };

      utter.onerror = () => {
        clearLineTimers();
        clearWordHighlights();
        onDone();
      };

      window.speechSynthesis.speak(utter);
    }

    /* ==========================================================================
       5. TAP WORD PHONICS TOAST
       ========================================================================== */
    const phonicsToast = document.getElementById('phonicsToast');
    const toastWord = document.getElementById('toastWord');
    const toastPhonics = document.getElementById('toastPhonics');
    let toastTimer = null;

    function speakWord(rawWord) {
      sound.playTap();
      const clean = getCleanWord(rawWord);
      const act = STORY_ACTS[currentActIndex];
      const phonicsVal = act.phonics[clean] || clean.split('').join(' · ');

      toastWord.textContent = clean;
      toastPhonics.textContent = phonicsVal;
      phonicsToast.style.display = 'block';

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        phonicsToast.style.display = 'none';
      }, 2200);

      if ('speechSynthesis' in window) {
        if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        window.speechSynthesis.cancel();
        setTimeout(() => {
          const utter = new SpeechSynthesisUtterance(clean);
          window._currentUtterance = utter;
          utter.rate = 0.75;
          utter.pitch = 1.1;
          if (speechVoices.length > 0) {
            utter.voice = speechVoices[selectedVoiceIndex] || speechVoices[0];
          }
          window.speechSynthesis.speak(utter);
        }, 35);
      }
    }

    document.addEventListener('pointerdown', (e) => {
      if (phonicsToast.style.display === 'block' && !phonicsToast.contains(e.target) && !e.target.classList.contains('word-chip')) {
        phonicsToast.style.display = 'none';
      }
    });

    function speakQuestion(text) {
      if (!('speechSynthesis' in window)) return;
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
      window.speechSynthesis.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      window._currentUtterance = utter;
      utter.rate = speechPaces[paceIndex] * 0.95;
      utter.pitch = 1.1; // Friendly questioning inflection
      if (speechVoices.length > 0) {
        utter.voice = speechVoices[selectedVoiceIndex] || speechVoices[0];
      }

      const qBtn = document.getElementById('quizQuestionBtn');
      if (qBtn) qBtn.style.transform = 'scale(1.05)';
      utter.onend = () => {
        if (qBtn) qBtn.style.transform = '';
      };
      utter.onerror = () => {
        if (qBtn) qBtn.style.transform = '';
      };

      window.speechSynthesis.speak(utter);
    }

    /* ==========================================================================
       6. RENDER & SCENE ANIMATION
       ========================================================================== */
    let currentActIndex = 0;
    let earnedStars = [false, false, false, false, false];

    const actTitle = document.getElementById('actTitle');
    const verseContainer = document.getElementById('verseContainer');
    const rhymeBar = document.getElementById('rhymeBar');
    const progressFill = document.getElementById('progressFill');
    const statusLabel = document.getElementById('statusLabel');
    const quizQuestion = document.getElementById('quizQuestion');
    const optionsRow = document.getElementById('optionsRow');

    const svgCharacters = document.getElementById('svgCharacters');
    const actorJack = document.getElementById('actorJack');
    const actorJill = document.getElementById('actorJill');
    const jackCrown = document.getElementById('jackCrown');
    const jackPlaster = document.getElementById('jackPlaster');
    const svgBucket = document.getElementById('svgBucket');
    const svgSun = document.getElementById('svgSun');
    const svgWell = document.getElementById('svgWell');
    const svgCottage = document.getElementById('svgCottage');

    function renderCurrentAct() {
      const act = STORY_ACTS[currentActIndex];

      actTitle.textContent = act.title;
      progressFill.style.width = `${((currentActIndex) / STORY_ACTS.length) * 100}%`;
      statusLabel.textContent = "Tap any word to hear phonics!";
      document.getElementById('readBtnText').textContent = "Read to Me";

      // Update Star Slots
      document.querySelectorAll('.star-item').forEach((slot, idx) => {
        slot.classList.toggle('earned', earnedStars[idx]);
      });

      // Render Interactive Story Emoji Ribbon
      const emojiRibbon = document.getElementById('emojiRibbon');
      if (emojiRibbon) {
        emojiRibbon.innerHTML = '';
        if (act.emojis) {
          act.emojis.forEach(em => {
            const s = document.createElement('span');
            s.className = 'emoji-item';
            s.textContent = em;
            s.onclick = () => {
              sound.playTap();
              s.style.transform = 'scale(1.4) rotate(10deg)';
              setTimeout(() => s.style.transform = '', 250);
              if (em === '🪣' || em === '💧') sound.playSplash();
              else if (em === '👑' || em === '⭐' || em === '💖') sound.playTone(880, 0.25, 'triangle', 0.2);
              else if (em === '💥' || em === '⬇️' || em === '🤸') sound.playTone(180, 0.25, 'sawtooth', 0.2);
              else sound.playTone(523.25, 0.15, 'sine', 0.2);
            };
            emojiRibbon.appendChild(s);
          });
        }
      }

      // Render Words by Line
      verseContainer.innerHTML = '';
      act.lines.forEach((lineStr, lineIdx) => {
        const row = document.createElement('div');
        row.className = 'verse-row';

        const words = lineStr.split(/\s+/);
        words.forEach((w) => {
          const btn = document.createElement('button');
          btn.className = 'word-chip';
          btn.textContent = w;
          btn.dataset.word = w;
          btn.dataset.line = lineIdx;

          const clean = getCleanWord(w);
          if (act.rhymes.includes(clean)) {
            btn.classList.add('rhyme-word');
          }

          btn.onclick = () => speakWord(w);
          row.appendChild(btn);
        });

        verseContainer.appendChild(row);
      });

      // Rhyme tags
      if (act.rhymes.length > 0) {
        rhymeBar.style.display = 'flex';
        rhymeBar.innerHTML = `<span>Rhymes:</span>` +
          act.rhymes.map(r => `<span class="rhyme-pill">${r}</span>`).join(' ');
      } else {
        rhymeBar.style.display = 'none';
      }

      // Quiz Questions
      quizQuestion.textContent = act.question;
      const qBtn = document.getElementById('quizQuestionBtn');
      if (qBtn) {
        qBtn.onclick = () => speakQuestion(act.question);
      }

      optionsRow.innerHTML = '';
      act.choices.forEach((choice) => {
        const card = document.createElement('button');
        card.className = 'option-card';
        card.innerHTML = `<span class="opt-icon">${choice.icon}</span><span class="opt-text">${choice.text}</span>`;
        card.onclick = () => handleChoice(choice, card);
        optionsRow.appendChild(card);
      });

      // Update SVG Stage
      updateStage(act);
    }

    function updateStage(act) {
      const cp = act.characterPos;
      svgCharacters.style.transition = "transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1)";
      svgCharacters.setAttribute('transform', `translate(${cp.x}, ${cp.y})`);

      actorJack.style.transition = "transform 0.45s ease";
      actorJack.setAttribute('transform', `rotate(${cp.jackR}, 22, 50)`);

      actorJill.style.transition = "transform 0.45s ease";
      actorJill.setAttribute('transform', `translate(50, 6) rotate(${cp.jillR}, 24, 50)`);

      jackCrown.style.display = cp.showCrown ? 'block' : 'none';
      jackPlaster.style.display = cp.showPlaster ? 'block' : 'none';

      const bp = act.bucketPos;
      svgBucket.style.transition = "transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1)";
      svgBucket.setAttribute('transform', `translate(${bp.x}, ${bp.y}) rotate(${bp.rot}, 20, 25)`);
    }

    /* ==========================================================================
       7. COMPREHENSION & STAR COLLECTION
       ========================================================================== */
    function handleChoice(choice, cardEl) {
      document.querySelectorAll('.option-card').forEach(b => b.disabled = true);

      if (choice.correct) {
        cardEl.classList.add('correct');
        sound.playSuccessChime();
        earnedStars[currentActIndex] = true;
        statusLabel.textContent = "⭐ Correct! Golden star earned!";

        const slot = document.querySelector(`.star-item[data-star="${currentActIndex}"]`);
        if (slot) slot.classList.add('earned');

        setTimeout(() => {
          if (currentActIndex < STORY_ACTS.length - 1) {
            currentActIndex++;
            renderCurrentAct();
            readCurrentAct();
          } else {
            progressFill.style.width = '100%';
            showCelebration();
          }
        }, 850);
      } else {
        cardEl.classList.add('wrong');
        sound.playTone(180, 0.25, 'sawtooth', 0.18);
        statusLabel.textContent = "Try again! You can do it!";

        setTimeout(() => {
          cardEl.classList.remove('wrong');
          document.querySelectorAll('.option-card').forEach(b => b.disabled = false);
        }, 500);
      }
    }

    function showCelebration() {
      sound.playFanfare();
      document.getElementById('celebrationModal').classList.add('active');
      launchConfetti();
    }

    /* ==========================================================================
       8. CONFETTI FINALE
       ========================================================================== */
    function launchConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = [];
      const colors = ['#FFD233', '#7357D9', '#38C172', '#3A86FF', '#FF6584'];

      for (let i = 0; i < 90; i++) {
        pieces.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.8) * 14,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 8
        });
      }

      let frame = 0;
      function step() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.3;
          p.rot += p.vRot;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot * Math.PI / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });

        frame++;
        if (frame < 120) {
          requestAnimationFrame(step);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(step);
    }

    /* ==========================================================================
       9. CONTROLS & INTERACTION
       ========================================================================== */
    document.getElementById('readBtn').onclick = () => {
      sound.init();
      readCurrentAct();
    };

    document.getElementById('pauseBtn').onclick = () => {
      if ('speechSynthesis' in window) {
        if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
          window.speechSynthesis.pause();
          statusLabel.textContent = "Paused";
        } else if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
          statusLabel.textContent = "Reading...";
        }
      }
    };

    document.getElementById('restartBtn').onclick = () => {
      readingCanceled = true;
      isReadingActive = false;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      clearLineTimers();
      clearWordHighlights();
      currentActIndex = 0;
      earnedStars = [false, false, false, false, false];
      renderCurrentAct();
    };

    document.getElementById('playAgainBtn').onclick = () => {
      document.getElementById('celebrationModal').classList.remove('active');
      currentActIndex = 0;
      earnedStars = [false, false, false, false, false];
      renderCurrentAct();
    };

    // Voice Selector Cycle
    document.getElementById('voiceBtn').onclick = () => {
      if (speechVoices.length === 0) populateVoices();
      if (speechVoices.length > 0) {
        selectedVoiceIndex = (selectedVoiceIndex + 1) % speechVoices.length;
        const v = speechVoices[selectedVoiceIndex];
        const vName = v.name.split(' ')[0];
        document.getElementById('voiceBtn').textContent = `🗣️ ${vName}`;
        sound.playTap();
        speakWord("Jack");
      }
    };

    // Speed Cycle
    document.getElementById('speedBtn').onclick = () => {
      paceIndex = (paceIndex + 1) % speechPaces.length;
      const p = speechPaces[paceIndex];
      const icon = p < 0.8 ? '🐢' : p > 0.9 ? '🐰' : '🚶';
      document.getElementById('speedBtn').textContent = `${icon} ${p}x`;
      sound.playTap();
    };

    // Mute Toggle
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    soundToggleBtn.onclick = () => {
      sound.muted = !sound.muted;
      soundToggleBtn.textContent = sound.muted ? '🔇' : '🔊';
    };

    // Interactive Stage Elements
    svgSun.onclick = () => {
      sound.playTone(880, 0.25, 'sine', 0.25);
      svgSun.style.transform = 'scale(1.2)';
      setTimeout(() => svgSun.style.transform = 'scale(1)', 250);
      statusLabel.textContent = "☀️ Warm sunshine on the hill!";
    };

    svgBucket.onclick = () => {
      sound.playSplash();
      svgBucket.style.transform += ' rotate(-15deg)';
      setTimeout(() => updateStage(STORY_ACTS[currentActIndex]), 280);
      statusLabel.textContent = "💧 Splish, splash! Fresh hill water!";
    };

    svgWell.onclick = () => {
      sound.playTone(330, 0.3, 'triangle', 0.2);
      statusLabel.textContent = "🪣 The deep stone well at the very top!";
    };

    svgCottage.onclick = () => {
      sound.playSuccessChime();
      statusLabel.textContent = "🏠 Cozy cottage of Old Dame Dob!";
    };

    /* ==========================================================================
       10. PWA INSTALLATION & SERVICE WORKER
       ========================================================================== */
    let deferredPrompt = null;
    const installBanner = document.getElementById('pwaInstallBanner');
    const installBtn = document.getElementById('installAppBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.classList.add('show');
    });

    installBtn.onclick = async () => {
      if (!deferredPrompt) return;
      installBanner.classList.remove('show');
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('SW Registered:', reg.scope))
          .catch((err) => console.log('SW Fail:', err));
      });
    }

    // Start Act 1
    renderCurrentAct();
  </script>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Jack and Jill - Read & Learn Storybook</title>
  
  <!-- PWA & Mobile Web App Meta -->
  <meta name="description" content="An interactive illustrated reading game and nursery rhyme storybook with karaoke read-aloud, phonics, and offline play.">
  <meta name="theme-color" content="#7357D9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jack & Jill">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    :root {
      --primary: #7357D9;
      --primary-dark: #583BB8;
      --primary-light: #EFEAFF;
      --yellow: #FFD95A;
      --yellow-light: #FFF8D6;
      --green: #45B97C;
      --green-light: #E6FAEF;
      --coral: #FF6B6B;
      --sky: #E8F5FF;
      --blue: #3A86FF;
      --ink: #1E2238;
      --ink-soft: #555B77;
      --white: #FFFFFF;
      --card-bg: #FFFFFF;
      --border: #E4DFFA;
      --shadow-sm: 0 4px 14px rgba(60, 40, 130, 0.08);
      --shadow-lg: 0 16px 40px rgba(50, 30, 110, 0.12);
      --radius-sm: 14px;
      --radius-md: 22px;
      --radius-lg: 32px;
      --font-display: "Fredoka", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #F2EEFF 0%, #FAF8FF 45%, #EAF5FF 100%);
      color: var(--ink);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Top Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.25rem;
      color: var(--primary);
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--yellow);
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      box-shadow: 0 4px 10px rgba(255, 217, 90, 0.4);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: var(--white);
      border: 2px solid var(--border);
      border-radius: 14px;
      width: 44px;
      height: 44px;
      font-size: 1.15rem;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, background 0.15s;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: var(--primary-light);
    }

    /* PWA Install Banner */
    #pwaInstallBanner {
      display: none;
      background: linear-gradient(90deg, #7357D9, #8C70EB);
      color: white;
      padding: 10px 16px;
      border-radius: 16px;
      margin: 0 16px 12px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 20px rgba(115, 87, 217, 0.25);
    }

    #pwaInstallBanner.show {
      display: flex;
    }

    .install-text {
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .install-btn {
      background: var(--yellow);
      color: var(--ink);
      border: none;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Main Container */
    main {
      flex: 1;
      width: min(940px, 100%);
      margin: 0 auto;
      padding: 0 16px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Star Reward Ribbon */
    .star-ribbon {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--white);
      padding: 10px 20px;
      border-radius: 999px;
      border: 2px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .act-indicator {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stars-track {
      display: flex;
      gap: 8px;
    }

    .star-slot {
      font-size: 1.4rem;
      filter: grayscale(100%) opacity(0.35);
      transition: filter 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .star-slot.earned {
      filter: none;
      transform: scale(1.18);
      animation: popStar 0.4s ease forwards;
    }

    @keyframes popStar {
      0% { transform: scale(0.6); }
      70% { transform: scale(1.35); }
      100% { transform: scale(1.15); }
    }

    /* Story Card */
    .story-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: clamp(16px, 4vw, 28px);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }

    /* Animated SVG Storybook Stage */
    .stage-container {
      width: 100%;
      height: clamp(180px, 32vw, 280px);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: linear-gradient(180deg, #BFE3FF 0%, #D8EFFF 65%, #C2E7B3 100%);
      border: 2px solid #D6E4F0;
      position: relative;
      cursor: pointer;
    }

    .stage-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .stage-hint {
      position: absolute;
      bottom: 8px;
      right: 12px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--ink-soft);
      pointer-events: none;
    }

    /* Rhyme Word Reader */
    .reader-box {
      text-align: center;
      padding: 8px 4px 14px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .verse-lines {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    .verse-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 10px;
      align-items: baseline;
    }

    .word-chip {
      font-size: clamp(1.6rem, 5vw, 2.75rem);
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 16px;
      border: 2px solid transparent;
      background: #F8F6FF;
      color: var(--ink);
      cursor: pointer;
      line-height: 1.1;
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      touch-action: manipulation;
    }

    .word-chip:hover {
      background: var(--yellow-light);
      border-color: var(--yellow);
    }

    .word-chip:active {
      transform: scale(0.94);
    }

    .word-chip.active {
      background: var(--yellow);
      border-color: #F0C430;
      transform: scale(1.08) translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 217, 90, 0.45);
      color: #111;
    }

    .word-chip.rhyme-match {
      text-decoration: underline wavy var(--primary);
      text-underline-offset: 6px;
    }

    /* Rhyme Family Pill */
    .rhyme-family-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ink-soft);
      background: #F4F1FD;
      padding: 8px 16px;
      border-radius: 999px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .rhyme-tag {
      background: var(--primary);
      color: white;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    /* Control Buttons */
    .controls-grid {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .ctrl-btn {
      border: 0;
      border-radius: 20px;
      padding: 14px 22px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      min-width: 140px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .ctrl-btn:active {
      transform: scale(0.96);
    }

    .ctrl-btn.primary {
      background: var(--primary);
      color: var(--white);
      box-shadow: 0 6px 18px rgba(115, 87, 217, 0.35);
    }

    .ctrl-btn.primary:hover {
      background: var(--primary-dark);
    }

    .ctrl-btn.secondary {
      background: var(--primary-light);
      color: var(--primary);
      border: 2px solid #DFD5FF;
    }

    .ctrl-btn.secondary:hover {
      background: #E5DCFF;
    }

    /* Progress & Status */
    .progress-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-bar {
      height: 12px;
      background: #EAE6F5;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #55D98F, #36B86C);
      width: 0%;
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .status-text {
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--ink-soft);
      min-height: 22px;
    }

    /* Phonics Pill Modal / Dropdown */
    #phonicsPopup {
      display: none;
      background: var(--white);
      border: 2px solid var(--primary);
      box-shadow: var(--shadow-lg);
      border-radius: 20px;
      padding: 12px 18px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      text-align: center;
      animation: popIn 0.2s ease forwards;
    }

    @keyframes popIn {
      from { transform: translate(-50%, -45%) scale(0.85); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .phonics-word {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--primary);
    }

    .phonics-breakdown {
      font-size: 1.1rem;
      color: var(--ink-soft);
      font-weight: 700;
      margin: 4px 0 8px;
    }

    /* Comprehension Mini-Task */
    .challenge-section {
      background: #FAF8FF;
      border: 2px dashed #D9D2F3;
      border-radius: var(--radius-md);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .challenge-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin: 0;
      color: var(--ink);
      text-align: center;
    }

    .choices-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 650px;
    }

    .choice-card {
      background: var(--white);
      border: 3px solid #E6E0F8;
      border-radius: 18px;
      padding: 14px 10px;
      font-size: clamp(1.2rem, 3.5vw, 1.8rem);
      font-weight: 800;
      cursor: pointer;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: var(--shadow-sm);
      touch-action: manipulation;
      transition: all 0.15s ease;
    }

    .choice-card:active {
      transform: scale(0.95);
    }

    .choice-card .choice-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ink-soft);
    }

    .choice-card.correct {
      border-color: var(--green);
      background: var(--green-light);
      transform: scale(1.02);
    }

    .choice-card.wrong {
      border-color: var(--coral);
      background: #FFF0F0;
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* Celebration Modal */
    .celebration-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(30, 20, 70, 0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .celebration-overlay.active {
      display: flex;
    }

    .celebration-card {
      background: white;
      border-radius: 32px;
      padding: 32px 24px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .celebration-card h2 {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--primary);
      margin: 10px 0;
    }

    .trophy-badge {
      font-size: 4.5rem;
      margin-bottom: 8px;
    }

    .celebration-stars {
      display: flex;
      justify-content: center;
      gap: 8px;
      font-size: 2.2rem;
      margin: 16px 0;
    }

    /* Confetti Canvas */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
    }

    /* Speed Control Pill */
    .speed-toggle {
      background: var(--white);
      border: 2px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    @media (max-width: 600px) {
      main { padding: 0 12px 20px; }
      .story-card { border-radius: 24px; padding: 14px 12px; }
      .choices-grid { grid-template-columns: 1fr; }
      .ctrl-btn { flex: 1 1 45%; min-width: 130px; padding: 12px 14px; font-size: 0.95rem; }
      .word-chip { padding: 4px 10px; font-size: clamp(1.4rem, 6.5vw, 2.1rem); }
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header>
    <div class="brand">
      <div class="brand-icon">🪣</div>
      <span>Jack & Jill</span>
    </div>
    <div class="top-actions">
      <button id="speedToggle" class="speed-toggle" title="Speech Speed">🐢 0.8x</button>
      <button id="muteBtn" class="icon-btn" title="Toggle Sound">🔊</button>
      <button id="fullscreenBtn" class="icon-btn" title="Full Screen">⛶</button>
    </div>
  </header>

  <!-- PWA Install Banner -->
  <div id="pwaInstallBanner">
    <div class="install-text">
      <span>📱</span>
      <span>Add to Home Screen for Offline Play!</span>
    </div>
    <button id="installAppBtn" class="install-btn">Install</button>
  </div>

  <main>
    <!-- Star Milestones Ribbon -->
    <div class="star-ribbon">
      <span id="actLabel" class="act-indicator">Act 1: The Hill</span>
      <div class="stars-track">
        <span class="star-slot" data-star="0">⭐</span>
        <span class="star-slot" data-star="1">⭐</span>
        <span class="star-slot" data-star="2">⭐</span>
        <span class="star-slot" data-star="3">⭐</span>
        <span class="star-slot" data-star="4">⭐</span>
      </div>
    </div>

    <!-- Main Story Card -->
    <section class="story-card">
      <!-- Animated SVG Storybook Stage -->
      <div id="storybookStage" class="stage-container" title="Tap elements in the picture!">
        <svg id="stageSvg" class="stage-svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#80C3FF"/>
              <stop offset="100%" stop-color="#D9F0FF"/>
            </linearGradient>
            <linearGradient id="hillFront" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#5CD389"/>
              <stop offset="100%" stop-color="#369E58"/>
            </linearGradient>
            <linearGradient id="hillBack" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#7BE29F"/>
              <stop offset="100%" stop-color="#4CB872"/>
            </linearGradient>
            <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFECB3"/>
              <stop offset="100%" stop-color="#E8C882"/>
            </linearGradient>
          </defs>

          <!-- Sky Background -->
          <rect width="800" height="360" fill="url(#skyGrad)"/>

          <!-- Smiling Sun (Interactive) -->
          <g id="svgSun" style="cursor: pointer; transform-origin: 720px 70px;">
            <circle cx="720" cy="70" r="42" fill="#FFD95A"/>
            <circle cx="720" cy="70" r="54" fill="#FFD95A" opacity="0.3"/>
            <!-- Sun Face -->
            <circle cx="708" cy="65" r="4" fill="#6B4B00"/>
            <circle cx="732" cy="65" r="4" fill="#6B4B00"/>
            <path d="M712,78 Q720,88 728,78" stroke="#6B4B00" stroke-width="3" fill="none" stroke-linecap="round"/>
            <ellipse cx="703" cy="73" rx="4" ry="2" fill="#FF9E9E"/>
            <ellipse cx="737" cy="73" rx="4" ry="2" fill="#FF9E9E"/>
          </g>

          <!-- Drifting Clouds -->
          <g opacity="0.85">
            <!-- Cloud 1 -->
            <path d="M120,60 Q130,40 155,45 Q180,35 205,50 Q225,50 225,70 Q215,85 190,85 L130,85 Q110,80 120,60 Z" fill="#FFFFFF"/>
            <!-- Cloud 2 -->
            <path d="M420,80 Q435,60 460,65 Q485,50 515,70 Q535,70 535,90 L430,90 Q410,85 420,80 Z" fill="#FFFFFF" opacity="0.75"/>
          </g>

          <!-- Distant Hills -->
          <path d="M-50,220 Q200,120 500,180 T900,150 L900,360 L-50,360 Z" fill="url(#hillBack)"/>

          <!-- Front Rolling Hill -->
          <path d="M-20,360 Q180,170 520,220 T850,230 L850,360 Z" fill="url(#hillFront)"/>

          <!-- Winding Cobblestone Pathway -->
          <path d="M100,360 Q340,310 440,245 T580,185" stroke="url(#pathGrad)" stroke-width="32" stroke-linecap="round" fill="none"/>
          <path d="M100,360 Q340,310 440,245 T580,185" stroke="#D3B26F" stroke-width="6" stroke-dasharray="16 12" stroke-linecap="round" fill="none" opacity="0.6"/>

          <!-- Cozy Cottage (Top Right / Left based on scene) -->
          <g id="svgCottage" transform="translate(40, 210)" style="cursor: pointer;">
            <!-- Chimney Smoke -->
            <circle cx="95" cy="-20" r="7" fill="#FFFFFF" opacity="0.6"/>
            <circle cx="102" cy="-35" r="10" fill="#FFFFFF" opacity="0.5"/>
            <!-- Chimney -->
            <rect x="90" y="-12" width="14" height="24" fill="#B35446" rx="2"/>
            <!-- Cottage Body -->
            <rect x="20" y="8" width="85" height="65" fill="#FFFBF0" stroke="#D8CEBA" stroke-width="2" rx="4"/>
            <!-- Roof -->
            <polygon points="12,12 62,-26 112,12" fill="#D25D4A"/>
            <!-- Door -->
            <rect x="48" y="35" width="24" height="38" fill="#8B5A2B" rx="4"/>
            <circle cx="66" cy="54" r="2.5" fill="#FFE066"/>
            <!-- Window -->
            <rect x="26" y="24" width="16" height="16" fill="#A4D8FF" rx="2"/>
          </g>

          <!-- Rustic Stone Well at Hilltop (Interactive) -->
          <g id="svgWell" transform="translate(560, 120)" style="cursor: pointer;">
            <!-- Well Stone Base -->
            <ellipse cx="45" cy="82" rx="38" ry="14" fill="#7D8597"/>
            <rect x="7" y="58" width="76" height="26" fill="#8C93A8" rx="4"/>
            <!-- Well Opening / Dark Water -->
            <ellipse cx="45" cy="58" rx="38" ry="12" fill="#2A3950"/>
            <ellipse cx="45" cy="60" rx="30" ry="8" fill="#3A86FF" opacity="0.8"/>
            <!-- Wooden Posts & Roof -->
            <rect x="12" y="10" width="8" height="50" fill="#7A4E2D" rx="2"/>
            <rect x="70" y="10" width="8" height="50" fill="#7A4E2D" rx="2"/>
            <!-- Roof Canopy -->
            <polygon points="2,14 45,-12 88,14" fill="#A8422B"/>
            <!-- Crank & Spindle -->
            <line x1="20" y1="28" x2="70" y2="28" stroke="#5C381E" stroke-width="6"/>
          </g>

          <!-- Water Bucket (Interactive) -->
          <g id="svgBucket" transform="translate(510, 195)" style="cursor: pointer;">
            <!-- Bucket Handle -->
            <path d="M4,16 Q20,-6 36,16" fill="none" stroke="#8898AA" stroke-width="3" stroke-linecap="round"/>
            <!-- Bucket Body -->
            <polygon points="6,14 34,14 29,42 11,42" fill="#3A86FF"/>
            <ellipse cx="20" cy="14" rx="14" ry="4" fill="#6CB2FF"/>
            <!-- Water Drops -->
            <circle id="drop1" cx="38" cy="18" r="4" fill="#67D9FF"/>
            <circle id="drop2" cx="44" cy="28" r="3" fill="#67D9FF"/>
          </g>

          <!-- Character Dynamic Actor Group -->
          <g id="svgCharacters" transform="translate(300, 175)">
            <!-- Jack Actor -->
            <g id="actorJack" transform="translate(0, 0)">
              <!-- Body -->

    /* ==========================================================================
       2. ZERO-DEPENDENCY NATIVE WEB AUDIO PROCEDURAL SYNTHESIZER
       ========================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, duration = 0.15, type = 'sine', gain = 0.25) {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

        g.gain.setValueAtTime(gain, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

        osc.connect(g);
        g.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      }

      playChime() {
        // Pentatonic bright chime
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 0.28, 'triangle', 0.22), idx * 80);
        });
      }

      playTapWord() {
        this.playTone(440, 0.08, 'sine', 0.18);
      }

      playTumble() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(580, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.45);

        g.gain.setValueAtTime(0.25, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.45);

        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.45);
      }

      playSplash() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;

        // Bubble pop sound
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(680, this.ctx.currentTime + 0.12);

        g.gain.setValueAtTime(0.3, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }

      playFanfare() {
        if (this.isMuted) return;
        const chord = [
          { f: 523.25, d: 0.2, t: 0 },
          { f: 659.25, d: 0.2, t: 120 },
          { f: 783.99, d: 0.25, t: 240 },
          { f: 1046.50, d: 0.6, t: 380 }
        ];
        chord.forEach(n => setTimeout(() => this.playTone(n.f, n.d, 'triangle', 0.3), n.t));
      }
    }

    const sound = new SoundEngine();

       ========================================================================== */

    /* ==========================================================================
       4. SPEECH SYNTHESIS ENGINE
       ========================================================================== */
    function getCleanWord(w) {
      return w.replace(/[.,!?;:"'()]/g, '').trim();
    }

    function getAllWordsInAct(act) {
      return act.lines.join(' ').split(/\s+/).map(getCleanWord).filter(Boolean);
    }

    function speakText(text, onWordCallback, onEndCallback) {
      if (!('speechSynthesis' in window)) {
        statusLabel.textContent = "Speech synthesis not supported in this browser.";
        if (onEndCallback) onEndCallback();
        return;
      }

      window.speechSynthesis.cancel();
      sound.init();

      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = speechRates[speechRateIndex];
      utter.pitch = 1.05;

      // Select warm natural voice if available
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => (v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('Google US English'))))
                     || voices.find(v => v.lang.startsWith('en'));
      if (preferred) utter.voice = preferred;

      utter.onboundary = (e) => {
        if (e.name === 'word' && onWordCallback) {
          onWordCallback(e.charIndex);
        }
      };

      utter.onend = () => {
        isSpeaking = false;
        document.querySelectorAll('.word-chip').forEach(el => el.classList.remove('active'));
        if (onEndCallback) onEndCallback();
      };

      utter.onerror = () => {
        isSpeaking = false;
        document.querySelectorAll('.word-chip').forEach(el => el.classList.remove('active'));
      };

      isSpeaking = true;
      window.speechSynthesis.speak(utter);
    }

    function speakWord(rawWord) {
      const clean = getCleanWord(rawWord);
      sound.playTapWord();

      // Show Phonics Popup
      const act = STORY_ACTS[currentActIndex];
      const phonicsVal = act.phonics[clean] || clean.split('').join(' · ');
      popupWord.textContent = clean;
      popupPhonics.textContent = phonicsVal;
      phonicsPopup.style.display = 'block';

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(clean);
        utter.rate = 0.75;
        utter.pitch = 1.1;
        window.speechSynthesis.speak(utter);
      }
    }

    function readCurrentAct() {
      const act = STORY_ACTS[currentActIndex];
      const fullText = act.lines.join(' ');
      statusLabel.textContent = "Listening to the story...";

      const allChips = Array.from(document.querySelectorAll('.word-chip'));

      speakText(
        fullText,
        (charIndex) => {
          // Calculate which word chip is active
          let count = 0;
          let activeIndex = -1;
          for (let i = 0; i < allChips.length; i++) {
            const word = allChips[i].dataset.word;
            if (charIndex >= count && charIndex < count + word.length + 1) {
              activeIndex = i;
              break;
            }
            count += word.length + 1;
          }

          allChips.forEach((chip, i) => {
            chip.classList.toggle('active', i === activeIndex);
          });
        },
        () => {
          statusLabel.textContent = `Completed ${act.title}! Pick the matching answer.`;
        }
      );
    }

    /* ==========================================================================
       5. RENDER & SCENE ANIMATION
       ========================================================================== */
    function renderCurrentAct() {
      const act = STORY_ACTS[currentActIndex];

      // Update Labels & Progress
      actLabel.textContent = act.title;
      progressFill.style.width = `${((currentActIndex) / STORY_ACTS.length) * 100}%`;
      statusLabel.textContent = "Tap any word to hear phonics!";

      // Update Star Slots
      document.querySelectorAll('.star-slot').forEach((slot, idx) => {
        slot.classList.toggle('earned', earnedStars[idx]);
      });

      // Render Words by Line
      verseContainer.innerHTML = '';
      act.lines.forEach((lineStr) => {
        const row = document.createElement('div');
        row.className = 'verse-row';

        const words = lineStr.split(/\s+/);
        words.forEach((w) => {
          const btn = document.createElement('button');
          btn.className = 'word-chip';
          btn.textContent = w;
          btn.dataset.word = w;

          const clean = getCleanWord(w);
          if (act.rhymes.includes(clean)) {
            btn.classList.add('rhyme-match');
          }

          btn.onclick = () => speakWord(w);
          row.appendChild(btn);
        });

        verseContainer.appendChild(row);
      });

      // Render Rhyme Family
      if (act.rhymes.length > 0) {
        rhymeFamily.style.display = 'flex';
        rhymeFamily.innerHTML = `<span>Rhyme Family:</span>` +
          act.rhymes.map(r => `<span class="rhyme-tag">${r}</span>`).join(' ');
      } else {
        rhymeFamily.style.display = 'none';
      }

      // Render Challenge Question & Choices
      taskQuestion.textContent = act.question;
      choicesGrid.innerHTML = '';
      act.choices.forEach((choice, idx) => {
        const card = document.createElement('button');
        card.className = 'choice-card';
        card.innerHTML = `<span style="font-size: 2rem;">${choice.icon}</span><span class="choice-label">${choice.text}</span>`;
        card.onclick = () => handleChoice(choice, card);
        choicesGrid.appendChild(card);
      });

      // Update SVG Storybook Stage
      updateStageScene(act);
    }

    function updateStageScene(act) {
      // Character positioning & animations
      const cp = act.characterPos;
      svgCharacters.style.transition = "transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)";
      svgCharacters.setAttribute('transform', `translate(${cp.x}, ${cp.y})`);

      actorJack.style.transition = "transform 0.5s ease";
      actorJack.setAttribute('transform', `rotate(${cp.jackR}, 22, 50)`);

      actorJill.style.transition = "transform 0.5s ease";
      actorJill.setAttribute('transform', `translate(50, 6) rotate(${cp.jillR}, 24, 50)`);

      // Accessories
      jackCrown.style.display = cp.showCrown ? 'block' : 'none';
      jackPlaster.style.display = cp.showPlaster ? 'block' : 'none';

      // Bucket
      const bp = act.bucketPos;
      svgBucket.style.transition = "transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)";
      svgBucket.setAttribute('transform', `translate(${bp.x}, ${bp.y}) rotate(${bp.rot}, 20, 25)`);
    }

    /* ==========================================================================
       6. CHALLENGE & STAR REWARD SYSTEM
       ========================================================================== */
    function handleChoice(choice, cardEl) {
      document.querySelectorAll('.choice-card').forEach(b => b.disabled = true);

      if (choice.correct) {
        cardEl.classList.add('correct');
        sound.playChime();
        earnedStars[currentActIndex] = true;
        statusLabel.textContent = "⭐ Wonderful! You got it right!";

        // Update star icon instantly
        const slot = document.querySelector(`.star-slot[data-star="${currentActIndex}"]`);
        if (slot) slot.classList.add('earned');

        setTimeout(() => {
          if (currentActIndex < STORY_ACTS.length - 1) {
            currentActIndex++;
            renderCurrentAct();
            readCurrentAct();
          } else {
            progressFill.style.width = '100%';
            showCelebration();
          }
        }, 900);
      } else {
        cardEl.classList.add('wrong');
        sound.playTone(180, 0.25, 'sawtooth', 0.2);
        statusLabel.textContent = "Try again! You can do it!";

        setTimeout(() => {
          cardEl.classList.remove('wrong');
          document.querySelectorAll('.choice-card').forEach(b => b.disabled = false);
        }, 500);
      }
    }

    function showCelebration() {
      sound.playFanfare();
      celebrationModal.classList.add('active');
      launchConfetti();
    }

    /* ==========================================================================
       7. CONFETTI ENGINE (PURE JAVASCRIPT)
       ========================================================================== */
    function launchConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = [];
      const colors = ['#FFD95A', '#7357D9', '#45B97C', '#3A86FF', '#FF6B6B'];

      for (let i = 0; i < 110; i++) {
        pieces.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.8) * 16,
          size: Math.random() * 8 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 10
        });
      }

      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35; // gravity
          p.rot += p.vRot;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot * Math.PI / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });

        frame++;
        if (frame < 140) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(animate);
    }

    /* ==========================================================================
       8. EVENT LISTENERS & INTERACTIVE TOUCH SPOTS
       ========================================================================== */
    document.getElementById('readBtn').onclick = readCurrentAct;

    document.getElementById('pauseBtn').onclick = () => {
      if ('speechSynthesis' in window) {
        if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
          window.speechSynthesis.pause();
          statusLabel.textContent = "Paused";
        } else if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
          statusLabel.textContent = "Reading...";
        }
      }
    };

    document.getElementById('restartBtn').onclick = () => {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      currentActIndex = 0;
      earnedStars = [false, false, false, false, false];
      renderCurrentAct();
    };

    closePhonicsBtn.onclick = () => {
      phonicsPopup.style.display = 'none';
    };

    playAgainBtn.onclick = () => {
      celebrationModal.classList.remove('active');
      currentActIndex = 0;
      earnedStars = [false, false, false, false, false];
      renderCurrentAct();
    };

    // Speed Toggle
    speedToggle.onclick = () => {
      speechRateIndex = (speechRateIndex + 1) % speechRates.length;
      const rate = speechRates[speechRateIndex];
      const icon = rate < 0.8 ? '🐢' : rate > 0.9 ? '🐰' : '🚶';
      speedToggle.textContent = `${icon} ${rate}x`;
      sound.playTapWord();
    };

    // Mute Toggle
    muteBtn.onclick = () => {
      sound.isMuted = !sound.isMuted;
      muteBtn.textContent = sound.isMuted ? '🔇' : '🔊';
    };

    // Fullscreen Toggle
    fullscreenBtn.onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        fullscreenBtn.textContent = '✕';
      } else {
        document.exitFullscreen().catch(() => {});
        fullscreenBtn.textContent = '⛶';
      }
    };

    // Stage Interactive Tap Spots
    svgSun.onclick = () => {
      sound.playTone(880, 0.3, 'sine', 0.3);
      svgSun.style.transform = 'scale(1.25)';
      setTimeout(() => svgSun.style.transform = 'scale(1)', 300);
      statusLabel.textContent = "☀️ Warm sunshine on the hill!";
    };

    svgBucket.onclick = () => {
      sound.playSplash();
      svgBucket.style.transform += ' rotate(-15deg)';
      setTimeout(() => updateStageScene(STORY_ACTS[currentActIndex]), 300);
      statusLabel.textContent = "💧 Splish, splash! Water in the bucket!";
    };

    svgWell.onclick = () => {
      sound.playTone(330, 0.35, 'triangle', 0.25);
      statusLabel.textContent = "🪣 An old stone well at the very top of the hill!";
    };

    svgCottage.onclick = () => {
      sound.playChime();
      statusLabel.textContent = "🏠 Cozy home of Old Dame Dob!";
    };

    /* ==========================================================================
       9. PWA INSTALLATION & SERVICE WORKER REGISTRATION
       ========================================================================== */
    let deferredPrompt = null;
    const installBanner = document.getElementById('pwaInstallBanner');
    const installBtn = document.getElementById('installAppBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.classList.add('show');
    });

    installBtn.onclick = async () => {
      if (!deferredPrompt) return;
      installBanner.classList.remove('show');
      deferredPrompt.prompt();
      const choiceResult = await deferredPrompt.userChoice;
      deferredPrompt = null;
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('ServiceWorker registered:', reg.scope))
          .catch((err) => console.log('ServiceWorker registration failed:', err));
      });
    }

    // Initialize App
    renderCurrentAct();
  </script>
</body>
</html>
